[main]
namespace=shell:launcher
font=ComicShannsMono Nerd Font:size=14
prompt="> "
sort-result=yes
cache=/dev/null
match-counter=yes
minimal-lines=yes
list-executables-in-path=yes
width=60
inner-pad=0
horizontal-pad=0
vertical-pad=4
line-height=24
anchor=top
y-margin=32

[colors]
background=333333ff
text=c2c2c2ff
prompt=c2c2c2ff
placeholder=c2c2c2ff
input=c2c2c2ff
match=d699b6ff
selection=d699b6ff
selection-text=333333ff
selection-match=333333ff
counter=c2c2c2ff
border=4a4a4aff

[border]
width=4
radius=0
selection-radius=0
