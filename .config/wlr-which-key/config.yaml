# Theming
font: NotoSansM Nerd Font 14
background: "#333333"
color: "#c2c2c2"
border: "#4a4a4a"
separator: "  ➜  "
border_width: 4
corner_r: 0
padding: 16

anchor: top-left
margin_right: 0
margin_bottom: 12
margin_left: 900
margin_top: 0

# namespace: "launcher"

inhibit_compositor_keyboard_shortcuts: false
auto_kbd_layout: true

menu:
  - key: "b"
    desc: brightness
    submenu:
      - key: "m"
        desc: ddcutil setvcp 10 100
        cmd: ddcutil setvcp 10 100
      - key: "n"
        desc: ddcutil setvcp 10 0
        cmd: ddcutil setvcp 10 0
      - key: "e"
        desc: ddcutil setvcp 10 44
        cmd: ddcutil setvcp 10 44
  - key: "p"
    desc: power
    submenu:
      - key: "s"
        desc: Sleep
        cmd: systemctl suspend
      - key: "r"
        desc: Reboot
        cmd: reboot
      - key: "o"
        desc: Off
        cmd: poweroff
  - key: "v"
    desc: volume
    submenu:
      - key: "j"
        desc: down
        cmd: volctl down
        keep_open: true
      - key: "k"
        desc: up
        cmd: volctl up
        keep_open: true
      - key: "m"
        desc: mute
        cmd: volctl toggle
        keep_open: true
      - key: "c"
        desc: cycle
        cmd: volctl cycle
        keep_open: true
  - key: "d"
    desc: run
    submenu:
      - key: "w"
        desc: zen-browser
        cmd: zen-browser
      - key: "p"
        desc: prismlauncher
        cmd: prismlauncher
      - key: "s"
        desc: steam
        cmd: steam
      - key: "d"
        desc: discord
        cmd: discord&discover-overlay
      - key: "n"
        desc: sunshine
        cmd: sunshine
      - key: "o"
        desc: obsidian
        cmd: obsidian
      - key: "k"
        desc: keepass
        cmd: keepassxc
      - key: "l"
        desc: libreoffice
        cmd: libreoffice
      - key: "g"
        desc: gimp
        cmd: gimp
      - key: "m"
        desc: cmus
        cmd: alacritty -e cmus
      - key: "v"
        desc: wiremix
        cmd: alacritty -e wiremix -v output -s extracompat
      - key: "space"
        desc: fuzzel
        cmd: fuzzel
      - key: "a"
        desc: anki
        cmd: anki
      - key: "c"
        desc: hyprpicker --autocopy
        cmd: hyprpicker --autocopy
      - key: "z"
        desc: zathura
        cmd: zathura
